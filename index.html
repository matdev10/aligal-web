<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link
      rel="icon"
      type="image/png"
      href="/images/brand/logo-blanco.png"
    />

    <!-- Fuente principal -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>
      Cerebria® | Memoria, concentración y aprendizaje
    </title>

    <meta
      name="description"
      content="Cerebria® es un suplemento alimentario con Omega 3, vitaminas y minerales diseñado para apoyar el bienestar y la salud cerebral."
    />

    <!-- Google Analytics 4. El ID sale de import.meta.env.VITE_GA_TRACKING_ID. -->
    <script type="module">
      const measurementId = import.meta.env.VITE_GA_TRACKING_ID;

      if (measurementId) {
        const script = document.createElement("script");
        script.async = true;
        script.src =
          "https://www.googletagmanager.com/gtag/js?id=" +
          encodeURIComponent(measurementId);
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];

        function gtag() {
          window.dataLayer.push(arguments);
        }

        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", measurementId);
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
